name: Deploy

# Every merge to main publishes the drilled image and asks the Infra repository's deploy workflow (D38) to
# deploy it by digest. The Portainer credentials live only there; this repository holds INFRA_DISPATCH_TOKEN
# (production environment), written with the rest of the stack's configuration by deploy/ (OpenTofu).
# docs/deploy.md has the setup.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer merge supersedes a queued one rather than racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/the-running-dev/subzerodev.biblestudy

jobs:
  image:
    name: image
    # A manual run from another branch would otherwise publish that branch as :latest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Built into the local daemon, not pushed: the exact image is drilled before anything is published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          build-args: BUILD_ID=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The same drill CI runs, on the image about to be published: compose.yaml with stack.env.example's
      # values, /__build-id, data surviving down/up, backup and restore, and a failed migration.
      - name: Drill the image before publishing
        run: node scripts/drill-stack.ts --image "$IMAGE:$GITHUB_SHA"

      # :<sha> is what a rollback pins; :latest is what compose.yaml pulls by default.
      - name: Publish the drilled image
        id: publish
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          digest="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$GITHUB_SHA" | grep "^$IMAGE@" | head -n1 | cut -d@ -f2)"
          test -n "$digest" || { echo "No digest for the pushed image"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: image
    # DEPLOY_ENABLED is set by deploy/ once the stack is under OpenTofu.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Infra validates the digest and revision, deploys it and waits until /__health reports this commit.
      - uses: The-Running-Dev/GitHub-ActionTemplates/actions/infra-deploy@c71f9720badd37b94b96da0c77633acc3a113647 # v2.2.0
        with:
          app: biblestudy
          digest: ${{ needs.image.outputs.digest }}
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}

      - name: Checkout
        if: vars.PUBLIC_URL != ''
        uses: actions/checkout@v5

      - name: Setup Node
        if: vars.PUBLIC_URL != ''
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Set the repository variable PUBLIC_URL (https://<hostname>) to have the deploy wait for the site to
      # serve this commit; without it the deploy ends once Portainer accepts the webhook.
      - name: Verify the site serves this build
        if: vars.PUBLIC_URL != ''
        run: node scripts/verify-deploy.ts "${{ vars.PUBLIC_URL }}" "$GITHUB_SHA"
