name: Deploy

# A merge to main publishes the image compose.yaml pulls, then (only when the owner has turned
# deploys on) asks Portainer to redeploy the stack. docs/deploy.md has the one-time setup.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer merge supersedes a queued one rather than racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/the-running-dev/subzerodev.biblestudy

jobs:
  image:
    name: image
    # A manual run from another branch would otherwise publish that branch as :latest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Built into the local daemon, not pushed: the exact image is drilled before anything is published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          build-args: BUILD_ID=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The same drill CI runs, on the image about to be published: compose.yaml with stack.env.example's
      # values, /__build-id, data surviving down/up, backup and restore, and a failed migration.
      - name: Drill the image before publishing
        run: node scripts/drill-stack.ts --image "$IMAGE:$GITHUB_SHA"

      # :<sha> is what a rollback pins; :latest is what compose.yaml pulls by default.
      - name: Publish the drilled image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  deploy:
    name: deploy
    needs: image
    # Off until the owner sets the repository variable DEPLOY_ENABLED to true and adds the
    # PORTAINER_REDEPLOY_WEBHOOK_URL secret; until then a merge only publishes the image.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy the Portainer stack
        env:
          REDEPLOY_WEBHOOK_URL: ${{ secrets.PORTAINER_REDEPLOY_WEBHOOK_URL }}
        run: |
          test -n "$REDEPLOY_WEBHOOK_URL" || { echo "PORTAINER_REDEPLOY_WEBHOOK_URL is not set"; exit 1; }
          curl -fsS --max-time 60 -X POST "$REDEPLOY_WEBHOOK_URL" -o /dev/null
          echo "Redeploy requested for ${{ github.sha }}"

      - name: Checkout
        if: vars.PUBLIC_URL != ''
        uses: actions/checkout@v5

      - name: Setup Node
        if: vars.PUBLIC_URL != ''
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Set the repository variable PUBLIC_URL (https://<hostname>) to have the deploy wait for the site to
      # serve this commit; without it the deploy ends once Portainer accepts the webhook.
      - name: Verify the site serves this build
        if: vars.PUBLIC_URL != ''
        run: node scripts/verify-deploy.ts "${{ vars.PUBLIC_URL }}" "$GITHUB_SHA"
