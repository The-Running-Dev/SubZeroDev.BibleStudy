name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No `paths` filter: this job reports on every pull request so merges always have a check.
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: biblestudy
          POSTGRES_PASSWORD: biblestudy
          POSTGRES_DB: biblestudy
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U biblestudy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # verification: true
      - name: Install
        run: npm ci

      # verification: true
      - name: Typecheck
        run: npm run typecheck

      # verification: true
      - name: Lint
        run: npm run lint

      # verification: true
      - name: Unit tests
        run: npm test

      # verification: true
      - name: Build client
        run: npm run build

      # verification: true
      - name: Integration tests (Postgres + Mailpit)
        run: npm run test:integration

      # verification: true
      - name: Browser tests (Chromium, phone viewport)
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e

      # verification: true
      # The production compose.yaml with stack.env.example's values: build id, data surviving down/up,
      # backup and restore into an empty stack, and a failing migration stopping the container.
      - name: Stack drill (compose.yaml, backup, restore, failed migration)
        run: npm run drill -- --build-id ci-${{ github.sha }}

      # verification: true
      - name: Check repository text and Markdown links
        run: node scripts/check-docs.ts
