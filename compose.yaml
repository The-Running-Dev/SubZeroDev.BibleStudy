# The production stack: the app, PostgreSQL, a nightly backup job and their volumes. It pulls the image
# that .github/workflows/deploy.yml publishes; it never builds. compose.dev.yaml is the local-development
# counterpart and shares nothing with this file.
#
#   docker compose pull && docker compose up -d
#
# Deployed as a Portainer Git stack, set the variables below in the stack's "Environment variables";
# Portainer feeds them into the ${...} interpolation and writes no .env file, so no service uses
# env_file. Running it by hand, copy .env.example to a git-ignored .env next to this file.
#
# Operator prerequisites (docs/deploy.md):
#   - the reverse proxy's network exists (default proxy-net); it is external, so Compose fails fast
#     instead of creating an isolated network the proxy cannot reach;
#   - the proxy routes the app hostname to biblestudy-app:3000 and terminates TLS;
#   - the DNS record for the hostname.

name: subzerodev-biblestudy

x-app: &app
  # Overridable so a rollback can pin a commit tag (`:<sha>`) without editing this file.
  image: "${BIBLESTUDY_IMAGE:-ghcr.io/the-running-dev/subzerodev.biblestudy:latest}"
  # :latest moves; without this a redeploy could reuse the image the host already holds.
  pull_policy: "${BIBLESTUDY_PULL_POLICY:-always}"
  restart: unless-stopped
  # Named resolvers, so outbound names (AO Lab, SMTP) do not depend on the host's resolver being
  # reachable from a container network. Container names such as `db` are still answered by Docker.
  dns:
    - 1.1.1.1
    - 9.9.9.9
  environment:
    # Assembled here so the database password is one secret and cannot drift from POSTGRES_PASSWORD.
    DATABASE_URL: "postgres://biblestudy:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/biblestudy"
    APP_SECRET: "${APP_SECRET:?Set APP_SECRET}"
    SMTP_URL: "${SMTP_URL:?Set SMTP_URL}"
    MAIL_FROM: "${MAIL_FROM:-Bible Study <no-reply@localhost>}"
    PUBLIC_URL: "${PUBLIC_URL:?Set PUBLIC_URL}"
    OWNER_EMAIL: "${OWNER_EMAIL:-}"
    COOKIE_SECURE: "${COOKIE_SECURE:-true}"
    # One proxy hop in front: the reverse proxy on proxy-net.
    TRUST_PROXY: "${TRUST_PROXY:-1}"
    AOLAB_BASE_URL: "${AOLAB_BASE_URL:-https://bible.helloao.org}"
    ASSISTANT_OWNER_EMAIL: "${ASSISTANT_OWNER_EMAIL:-}"
    CONNECTOR_TOKEN: "${CONNECTOR_TOKEN:-}"
    BACKUP_AT: "${BACKUP_AT:-03:30}"
    BACKUP_KEEP: "${BACKUP_KEEP:-14}"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: biblestudy
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      POSTGRES_DB: biblestudy
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblestudy -d biblestudy"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Only the stack's own network: nothing outside the stack reaches PostgreSQL.
    networks:
      - internal

  # Runs the migrations once per deploy. If one fails, `up` stops here and the running app is not
  # replaced. The app also migrates on start (a no-op after this) and exits if that fails.
  migrate:
    <<: *app
    command: ["node", "src/server/platform/migrate-cli.ts"]
    restart: "no"
    healthcheck:
      disable: true
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    volumes:
      - media:/app/data/media
    # No published port: the reverse proxy reaches it over the proxy network by this alias.
    networks:
      internal:
      proxy:
        aliases:
          - biblestudy-app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # pg_dump plus a media manifest every day at BACKUP_AT (UTC); keeps BACKUP_KEEP runs.
  backup:
    <<: *app
    command: ["node", "src/server/platform/backup-cli.ts", "schedule"]
    # The image's health check probes the web listener, which this service does not run.
    healthcheck:
      disable: true
    volumes:
      - media:/app/data/media
      # A named volume by default. Set BACKUP_DIR to a host path (owned by uid 1000) to keep the
      # backups where the host's own off-site sync can pick them up.
      - "${BACKUP_DIR:-backups}:/app/data/backups"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  media:
  backups:

networks:
  internal:
  proxy:
    name: "${PROXY_NETWORK:-proxy-net}"
    external: true
