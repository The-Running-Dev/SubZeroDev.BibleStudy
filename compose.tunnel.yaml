# Cloudflare Tunnel connector for the VPS. It joins the proxy network, where `biblestudy-app` already lives,
# so nothing is published on the host. TUNNEL_TOKEN comes from the stack environment (deploy/, OpenTofu).
# Layer it over compose.yaml.
services:
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN}
    dns: [1.1.1.1, 9.9.9.9]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks:
      - proxy
    depends_on:
      - biblestudy

networks:
  proxy:
    name: "${PROXY_NETWORK:-proxy-net}"
    external: true
